name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      create_github_release:
        description: 'Create a GitHub Release with APK attached'
        required: true
        default: true
        type: boolean
      release_title:
        description: 'Release Title (optional)'
        required: false
        default: 'RemoteLink APK Release'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Rename and Stage APKs
        id: stage_apks
        run: |
          mkdir -p release-apks
          VERSION_NAME="v1.0"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/}"
          fi
          
          # Copy Debug APK if generated
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/RemoteLink-${VERSION_NAME}-debug.apk
            echo "debug_apk=release-apks/RemoteLink-${VERSION_NAME}-debug.apk" >> $GITHUB_OUTPUT
          fi
          
          # Copy Release APK if generated
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/RemoteLink-${VERSION_NAME}-release.apk
            echo "release_apk=release-apks/RemoteLink-${VERSION_NAME}-release.apk" >> $GITHUB_OUTPUT
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-apks/RemoteLink-${VERSION_NAME}-release-unsigned.apk
          fi

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotelink-apks
          path: release-apks/*
          retention-days: 30

      - name: Create or Update GitHub Release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ github.event.inputs.release_title || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'RemoteLink Android APK (v1.0.0)' }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-apks/*
          body: |
            ## 📱 RemoteLink Android APK Release
            
            ### ✨ Features Included:
            - **Device Pairing:** Instant pairing via QR Code scanner (CameraX + ZXing) & manual IP/Port entry.
            - **Privacy First:** Explicit Allow/Deny consent dialog before any data or file can flow.
            - **Bidirectional File Transfer:** Send and receive files in 64KB chunks directly over local WebSocket with zero broad storage permissions.
            - **Notification Mirroring:** `NotificationListenerService` mirrors incoming alerts to PC with persistent ongoing user notice.
            - **Gemini AI Assistant:** Powered by Firebase AI Logic (`gemini-3.8-flash`) for smart alert digests, file security analysis, and network troubleshooting.
            - **Dynamic Theme:** Toggleable Dark Mode (OLED low-light), Light Mode, and Material You Dynamic Colors (Android 12+).
            - **Built-in Server Hub:** Contains full `server.js` and `panel.html` web panel code for PC with one-tap copy.
            
            ### 📥 Installation Instructions:
            1. Download the `.apk` file below directly to your Android device.
            2. Tap the downloaded APK in your device notifications or Downloads folder.
            3. If prompted, allow "Install unknown apps" for your browser or file manager.
            4. Open RemoteLink and enjoy!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
